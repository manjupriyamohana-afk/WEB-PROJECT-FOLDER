<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="avatar">🎓</div>

        <h2>Student Profile</h2>

        <div class="field">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="e.g. Ananya Sharma">
        </div>

        <div class="field">
            <label>Roll Number</label>
            <input type="text" id="roll" placeholder="e.g. 2024CS01">
        </div>

        <div class="field">
            <label>Marks (out of 100)</label>
            <input type="number" id="mark" placeholder="Enter marks" min="0" max="100">
        </div>

        <button onclick="displayProfile()">📋 Show Profile</button>

        <div class="profile-box">

            <h3>📌 Student Summary</h3>

            <p>
                <span class="label">Name</span>
                <span class="value" id="dispName">—</span>
            </p>

            <p>
                <span class="label">Roll No.</span>
                <span class="value" id="dispRoll">—</span>
            </p>

            <p>
                <span class="label">Marks</span>
                <span class="value" id="dispMark">—</span>
            </p>

            <p>
                <span class="label">Grade</span>
                <span class="value" id="dispGrade">—</span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
