<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ring Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <div class="ring" id="ring">

            <div class="inner">
                <div id="count">0</div>
                <div id="mood">😐</div>
            </div>

        </div>

        <div class="buttons">
            <button class="minus" onclick="minus()">-</button>
            <button class="plus" onclick="plus()">+</button>
            <button class="reset" onclick="resetCount()">Reset</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
